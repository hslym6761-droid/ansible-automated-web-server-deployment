---
- name: automated web server deployment
  hosts: webservers
  become: true



  tasks:

    - name: install apache
      dnf:
        name: httpd
        state: present

    - name: start and enable apache
      service:
        name: httpd
        state: started
        enabled: true

    - name: install firewalld
      dnf:
        name:
          - firewalld
          - python3-firewall
        state: present


    - name: start firewalld
      service:
        name: firewalld
        state: started
        enabled: true


    - name: allow http traffic
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled


    - name: deploy website
      copy:
        src: files/index.html
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: '0644'


    - name: configure selinux
      selinux:
        policy: targeted
        state: enforcing
